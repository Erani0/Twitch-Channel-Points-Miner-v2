scripts:
  installation:
    script: |
      #!/bin/bash
      set -e

      echo "=== START DER INSTALLATION ==="
      apt-get update -y
      apt-get install -y git

      cd /mnt/server

      echo "Raeume temporaere Ordner auf..."
      rm -rf .tmp_miner

      echo "Lade Twitch-Channel-Points-Miner-v2 von GitHub herunter..."
      git clone https://github.com/Erani0/Twitch-Channel-Points-Miner-v2.git .tmp_miner

      echo "Verschiebe Dateien..."
      cp -r .tmp_miner/* ./
      cp -r .tmp_miner/.[!.]* ./ 2>/dev/null || true
      rm -rf .tmp_miner

      echo "Entferne unnoetige Entwicklungsdateien..."
      rm -rf .github tests setup.py pyproject.toml uv.lock egg-twitch-channel-points-miner CODE_OF_CONDUCT.md CONTRIBUTING.md FAQ.md FEEDBACK_AUDIT.md FORK_FEATURES.md LICENSE README.md .gitattributes .git-blame-ignore-revs .release-please-manifest.json release-please-config.json AGENTS.md BUILD.md CHANGELOG.md DOCKERHUB.md SECURITY.md CLAUDE.md CLONE.md TRAFFIC.md DELETE_PYCACHE.bat Dockerfile build_windows.bat windows_installer.iss windows_launcher.py pytest.ini requirements-dev.txt requirements-optional.txt requirements-windows.txt docs supervisor tools

      if [ -f /mnt/server/run.py ] && ! grep -q "eranio.launcher import run" /mnt/server/run.py; then
        if [ -f /mnt/server/run.py.v2-sicherung ]; then
          cp -p /mnt/server/run.py "/mnt/server/run.py.v2-sicherung.$(date +%Y%m%d-%H%M%S)"
        else
          cp -p /mnt/server/run.py /mnt/server/run.py.v2-sicherung
        fi
        echo "Bisherige run.py gesichert, die Einstellungen werden beim Start uebernommen."
      fi

      echo "Erstelle die schlanke run.py..."
      cp TwitchChannelPointsMiner/eranio/templates/run.py /mnt/server/run.py.neu
      mv -f /mnt/server/run.py.neu /mnt/server/run.py
      mkdir -p /mnt/server/config

      echo "=== INSTALLATION ERFOLGREICH ABGESCHLOSSEN ==="
    container: 'ghcr.io/pterodactyl/installers:debian'
    entrypoint: bash
